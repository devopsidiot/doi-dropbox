name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run if the same branch is pushed again — no point burning
# minutes on a commit that's already superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to no permissions, then grant per-job. Least privilege applies to CI
# tokens the same way it applies to IAM roles.
permissions:
  contents: read

jobs:
  verify:
    # This repo is three independent Go modules, not one: the CLI under ./cli,
    # the Lambda handler under ./lambda, and the local preview server under
    # ./preview, each with its own go.mod. There is no module at the repo root,
    # so every Go command has to run inside one of them.
    name: Build, vet, test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      # Report every module's failures in one run rather than hiding the later
      # ones behind the first.
      fail-fast: false
      matrix:
        module: [cli, lambda, preview]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Read the version from the module's go.mod rather than pinning it
          # here, so there's one place to bump it.
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          # setup-go resolves these from the workspace root, not from
          # working-directory, so they need the module prefix spelled out.
          # go.mod is listed as well as go.sum because preview/ has no
          # dependencies and so has no go.sum, and setup-go errors out if the
          # path resolves to nothing at all.
          cache-dependency-path: |
            ${{ matrix.module }}/go.mod
            ${{ matrix.module }}/go.sum

      # gofmt is checked first and fails loudly: formatting is not a matter of
      # opinion in Go, and catching it here keeps diffs free of noise.
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -race catches data races that only appear under concurrency. This CLI is
      # mostly sequential today, but the check is cheap and guards future changes.
      - name: Test
        run: go test ./... -race -coverprofile=coverage.out

      - name: Report coverage
        run: go tool cover -func=coverage.out | tail -1

  lint:
    name: golangci-lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [cli, lambda, preview]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: |
            ${{ matrix.module }}/go.mod
            ${{ matrix.module }}/go.sum
      # v6 installs golangci-lint v1, which cannot parse a `version: "2"`
      # config and fails before it looks at any code. The v2 config schema
      # needs action v7 or newer.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          # The linter needs to run inside the module too; .golangci.yaml stays
          # at the repo root and applies to all of them.
          working-directory: ${{ matrix.module }}

  # Confirms the binary actually builds for the platforms we claim to support.
  # A CLI that only compiles on the maintainer's laptop isn't shareable. Only
  # the CLI is cross-compiled — the Lambda handler is built for one target by
  # the release tooling, so a matrix of desktop platforms would prove nothing.
  cross-compile:
    name: Cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o /dev/null ./...
